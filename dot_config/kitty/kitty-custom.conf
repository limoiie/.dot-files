# ---------- Fonts ----------
font_family      LXGW WenKai Mono
# font_family      Syne Mono
# font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 17.0

# ---------- Color theme ----------
#: Include color pallete
# include ./light-theme.conf
include ./dark-theme.conf

# ---------- Layout ----------
# The Splits layout which has similar ux with iterm and warp
enabled_layouts splits:equalize_on_close=true

# ---------- Command palette ----------
map kitty_mod+p command_palette

# ---------- Tab switching (Cmd+1 … Cmd+9) ----------
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ---------- Split panes ----------
# Cmd+D         -> new pane to the right (vertical divider)
# Cmd+Shift+D   -> new pane below        (horizontal divider)
map cmd+d       launch --location=vsplit
map cmd+shift+d launch --location=hsplit

# ---------- Cycle panes (prev / next) ----------
map cmd+[ previous_window
map cmd+] next_window

# ---------- Focus pane by direction ----------
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
